<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おみくじアプリ</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。
      各要素に class（例: omikuji-result）を付けているので、CSS を足して自由に装飾できる。
      拡張ポイント（ステップ2以降）: 結果やボタンの文言・色を変える（この <style> を編集）。
    -->
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
        line-height: 1.6;
      }

      .omikuji-result {
        margin: 16px 0;
        padding: 16px;
        font-size: 32px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      .omikuji-controls button {
        margin-right: 8px;
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
      }
      #draw-button {
        background-color: #ff5623;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
        position: relative;

        /* 軽い立体感（2pxの影） */
        box-shadow: 0 2px 0 #b33a1c;
      }

      /* 修正：:hover ではなく、JSでクラスがついた瞬間だけ実行する */
      #draw-button.active-dip {
        animation: dipAndReturn-draw 0.2s ease;
      }
      
      /* アニメーションの流れ（内容はそのまま） */
      @keyframes dipAndReturn-draw {
        0% {
          transform: translateY(0);
          box-shadow: 0 2px 0 #9b3414;
        }
        50% {
          transform: translateY(2px);
          box-shadow: 0 0 0 #9b3414;
        }
        100% {
          transform: translateY(0);
          box-shadow: 0 2px 0 #9b3414;
        }
      }

      #reset-button {
        /* 通常時の見た目 */
        background-color: #3561f3;
        color: #fff;
        padding: 8px 16px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        position: relative;
        
        /* 軽い立体感（2pxの影） */
        box-shadow: 0 2px 0 #14257c;
      }

      /* 修正：:hover ではなく、JSでクラスがついた瞬間だけ実行する */
      #reset-button.active-dip {
        animation: dipAndReturn-reset 0.2s ease;
      }

      /* アニメーションの流れ（内容はそのまま） */
      @keyframes dipAndReturn-reset {
        0% {
          transform: translateY(0);
          box-shadow: 0 2px 0 #14257c;
        }
        50% {
          transform: translateY(2px);
          box-shadow: 0 0 0 #14257c;
        }
        100% {
          transform: translateY(0);
          box-shadow: 0 2px 0 #14257c;
        }
      }
      /* 背景・和風スタイル */
      body { background: #f7f4ed radial-gradient(#d3c4ad 15%, transparent 16%) 0 0/30px 30px; transition: background 0.8s; }
      body.kyo-bg { background: #1a1221 !important; }
      
      /* おみくじ箱＆揺れアニメーション */
      .omikuji-box-wrapper { text-align: center; margin: 12px 0 -8px; }
      .omikuji-box { font-size: 56px; display: inline-block; user-select: none; }
      .omikuji-box.shake { animation: shakeBox 0.4s ease-in-out; }
      @keyframes shakeBox { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-15deg) translateY(-6px); } 75% { transform: rotate(15deg) translateY(-6px); } }
    
      /* --- 表示切り替え用クラス --- */
      .is-hidden { display: none !important; }

      /* --- 箱のサイズアップ（初期表示用） --- */
      .omikuji-box-wrapper { text-align: center; margin: 20px 0; }
      .omikuji-box {
        font-size: 110px;
        line-height: 1;
        display: inline-block;
        user-select: none;
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      }
      .omikuji-box.shake { animation: shakeBox 0.4s ease-in-out; }
      @keyframes shakeBox {
        0%, 100% { transform: rotate(0); }
        25% { transform: rotate(-15deg) translateY(-6px); }
        75% { transform: rotate(15deg) translateY(-6px); }
      }
      /* --- 御札風デザイン＆演出CSS --- */
      .omikuji-result {
        position: relative !important;
        background-color: #fffdf9 !important;
        border: 3px solid #8c1d0d !important;
        outline: 1px solid #8c1d0d;
        outline-offset: -6px;
        border-radius: 4px !important;
        padding: 28px 16px 36px !important;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
        font-weight: bold;
        font-size: 32px;
        text-align: center;
        margin: 16px 0;
      }
      .omikuji-result::before { content: "― 奉納 ―"; display: block; font-size: 11px; color: #8c1d0d; letter-spacing: 3px; margin-bottom: 6px; font-weight: normal; }
      .omikuji-result::after { content: "神社"; position: absolute; right: 10px; bottom: 10px; width: 26px; height: 26px; border: 2px solid #b82308; color: #b82308; font-size: 10px; line-height: 12px; border-radius: 3px; display: flex; align-items: center; justify-content: center; transform: rotate(-6deg); }

      .result-大吉 { color: #d49b00 !important; text-shadow: 0 0 6px rgba(212, 155, 0, 0.3); }
      .result-吉, .result-中吉, .result-小吉, .result-末吉 { color: #8c1d0d !important; }
      .result-凶 { color: #4a2e5d !important; }

      #effects { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
      .fog { position: absolute; inset: -50%; background: radial-gradient(circle, rgba(112, 48, 160, 0.4) 0%, transparent 70%); animation: fogMove 8s infinite alternate; }
      @keyframes fogMove { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
      .particle { position: absolute; top: -20px; animation: fall linear forwards; }
      @keyframes fall { to { transform: translateY(105vh) rotate(360deg); opacity: 0; } }

    </style>

  </head>

  <body>
    <!-- 追加①: 演出レイヤー（bodyの直下に挿入） -->
    <div id="effects"></div>
    <h1>おみくじアプリ</h1>
    <p>「おみくじを引く」ボタンを押してみましょう。</p>

    <!--
      結果を表示する場所。render.ts が id="result" を取得して書き換える。
      ステップ1 を実装するまでは、この固定の文言のまま変わらない。
    -->
    <!-- 追加②: おみくじ箱（id="result" の直前に挿入） -->
    <div class="omikuji-box-wrapper">
      <div id="omikuji-box" class="omikuji-box">⛩️</div>
    </div>
    <div id="result" class="omikuji-result">ここに結果が出ます</div>

    <!-- 操作ボタン。クリック時の処理は main.ts で結びつけている。 -->
    <div class="omikuji-controls">
      <button id="draw-button" onmousedown="this.classList.add('active-dip'); setTimeout(() => this.classList.remove('active-dip'), 200)">おみくじを引く</button>
      <button id="reset-button" onmousedown="this.classList.add('active-dip'); setTimeout(() => this.classList.remove('active-dip'), 200)">リセット</button>
    </div>

    <!--
      拡張ポイント（ステップ2以降で使う空きエリア）。使わないうちは消してもよい。
        - 残りくじ枚数を出す → <div id="remaining">
        - 引いた履歴を出す   → <ul id="history"> に <li> を足していく
    -->
    <div id="remaining" class="omikuji-remaining"></div>
    <ul id="history" class="omikuji-history"></ul>

    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
